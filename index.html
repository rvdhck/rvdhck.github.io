 = W × F","s = W + F"]}]},{"id":"eff","t":"efficiency","name":"Efficiency (energy)","status":"Learn by heart","sym":"efficiency = <span class=\"fr\"><span>useful output energy transfer<\/span><span>total input energy transfer<\/span><\/span>","plain":"efficiency = useful output energy ÷ total input energy","words":"","units":[["","efficiency","no unit (× 100 for %)"]],"tip":"Useful over total. The answer is always less than 1. If yours isn’t, you divided the wrong way round.","wrong":["efficiency = total input energy ÷ useful output energy","efficiency = useful output energy ÷ wasted energy","efficiency = wasted energy ÷ total input energy"],"gap":{"show":"efficiency = useful output energy ÷ ▢","answer":"total input energy","options":["total input energy","wasted energy","useful output energy","time"]},"rearr":[{"find":"useful output","right":"useful = efficiency × total input","wrong":["useful = total input ÷ efficiency","useful = efficiency ÷ total input","useful = total input − efficiency"]},{"find":"total input","right":"total input = useful ÷ efficiency","wrong":["total input = useful × efficiency","total input = efficiency ÷ useful","total input = useful − efficiency"]}]},{"id":"effp","t":"efficiency","name":"Efficiency (power)","status":"Learn by heart","sym":"efficiency = <span class=\"fr\"><span>useful power output<\/span><span>total power input<\/span><\/span>","plain":"efficiency = useful power output ÷ total power input","words":"","units":[["","efficiency","no unit (× 100 for %)"]],"tip":"Exactly the same idea as the energy version, just with power in watts instead of energy in joules.","wrong":["efficiency = total power input ÷ useful power output","efficiency = useful power output × total power input","efficiency = wasted power ÷ useful power output"],"gap":{"show":"efficiency = ▢ ÷ total power input","answer":"useful power output","options":["useful power output","wasted power","total power input","energy"]},"rearr":[{"find":"total power input","right":"total power input = useful power output ÷ efficiency","wrong":["total power input = useful power output × efficiency","total power input = efficiency ÷ useful power output","total power input = useful power output − efficiency"]}]}],"unitPool":["J","W","kg","m/s","N/kg","m","N/m","J/kg °C","°C","s","N"],"memory":[["Say it with the units","Read each equation out loud in words, then say the unit for every letter. “Power equals energy over time. Watts, joules, seconds.”"],["Blank page","Close everything and write every equation you know on a blank page. Check, then fix the gaps in a different colour. Do it again tomorrow."],["Spot the patterns","Kinetic and elastic potential energy have the same shape: a half, a constant, something squared. Both power equations are “something ÷ time”."],["Formula triangles","For equations with three letters and no squares (P = E ÷ t, W = F s), put the multiplied letters on the bottom. Cover the one you want."],["Little and often","Five minutes a day beats an hour the night before. The drill below brings back the equations you get wrong more often."]],"lessons":[{"id":"l1","n":1,"t":"stores","title":"Energy stores and systems","summary":"What a system is, the 8 energy stores, the 4 ways energy moves, and how to describe energy changes.","minutes":60,"sections":[{"kind":"Do now","title":"Quick recall","minutes":5,"blocks":[{"type":"text","html":"<p>Answer these on paper before you look.<\/p>"},{"type":"reveal","items":[{"band":null,"q":"What is the unit of energy?","a":"The joule (J)."},{"band":null,"q":"Name one thing that stores chemical energy.","a":"Food, fuel or a battery."},{"band":null,"q":"What is the unit of force?","a":"The newton (N)."},{"band":null,"q":"Is energy “used up” when you run?","a":"No. It is transferred to other stores, mostly the thermal store of your body and the surroundings."}]}]},{"kind":"Learn","title":"Systems and energy stores","minutes":12,"blocks":[{"type":"objectives","items":["Say what a system is","Name all 8 energy stores","Name the 4 ways energy is transferred","Describe how energy stores change in everyday situations"]},{"type":"text","html":"<p>In physics a <b>system<\/b> is simply the object, or group of objects, you are looking at. It could be a ball, a car, or a kettle and the water inside it.<\/p><p>When something happens to a system, energy moves from one <b>store<\/b> to another. The <b>total<\/b> amount of energy stays the same.<\/p>"},{"type":"text","html":"<div class=\"tablewrap\"><table><thead><tr><th>Store<\/th><th>The object has energy because…<\/th><th>Example<\/th><\/tr><\/thead><tbody><tr><td>Kinetic<\/td><td>it is moving<\/td><td>a rolling ball<\/td><\/tr><tr><td>Gravitational potential<\/td><td>it is raised above the ground<\/td><td>a book on a shelf<\/td><\/tr><tr><td>Elastic potential<\/td><td>it is stretched, squashed or bent<\/td><td>a stretched spring<\/td><\/tr><tr><td>Thermal<\/td><td>of its temperature<\/td><td>a cup of tea<\/td><\/tr><tr><td>Chemical<\/td><td>of the chemicals it contains<\/td><td>food, fuel, a battery<\/td><\/tr><tr><td>Magnetic<\/td><td>of magnets attracting or repelling<\/td><td>two fridge magnets<\/td><\/tr><tr><td>Electrostatic<\/td><td>of charges attracting or repelling<\/td><td>a charged balloon<\/td><\/tr><tr><td>Nuclear<\/td><td>of the particles in the nucleus of its atoms<\/td><td>uranium in a power station<\/td><\/tr><\/tbody><\/table><\/div>"},{"type":"book","html":"<p>A <b>system<\/b> is an object or group of objects.<\/p><p>The 8 energy stores: kinetic, gravitational potential, elastic potential, thermal, chemical, magnetic, electrostatic, nuclear.<\/p>"},{"type":"tip","html":"<p><b>How to remember all 8:<\/b> split them into 4 you can see and 4 that are hidden.<\/p><p>You can see when something is <b>moving<\/b> (kinetic), <b>high up<\/b> (gravitational potential), <b>stretched<\/b> (elastic potential) or <b>hot<\/b> (thermal).<\/p><p>Hidden inside are <b>chemical<\/b>, <b>nuclear<\/b>, <b>magnetic<\/b> and <b>electrostatic<\/b>.<\/p>"}]},{"kind":"Learn","title":"How energy is transferred","minutes":8,"blocks":[{"type":"text","html":"<p>Energy moves between stores in four ways:<\/p>"},{"type":"text","html":"<div class=\"tablewrap\"><table><thead><tr><th>Way<\/th><th>What happens<\/th><th>Example<\/th><\/tr><\/thead><tbody><tr><td>Mechanically<\/td><td>a force does work<\/td><td>pushing a trolley<\/td><\/tr><tr><td>Electrically<\/td><td>a current flows<\/td><td>a kettle plugged in<\/td><\/tr><tr><td>By heating<\/td><td>energy moves from a hotter object to a cooler one<\/td><td>a pan on a hob<\/td><\/tr><tr><td>By radiation<\/td><td>light or sound waves carry energy<\/td><td>the Sun warming the Earth<\/td><\/tr><\/tbody><\/table><\/div>"},{"type":"book","html":"<p>Energy is transferred <b>mechanically<\/b>, <b>electrically<\/b>, <b>by heating<\/b> and <b>by radiation<\/b>. The total energy of a system never changes.<\/p>"}]},{"kind":"Worked example","title":"Describing energy changes","minutes":10,"blocks":[{"type":"text","html":"<p>Use this sentence frame in every answer. Examiners look for the <b>name of the store<\/b> and <b>whose<\/b> store it is.<\/p>"},{"type":"book","html":"<p>The ______ store of ______ decreases. Energy is transferred ______. The ______ store of ______ increases.<\/p>"},{"type":"steps","title":"A ball is thrown straight up","steps":["Before it leaves your hand, the ball is moving fast: it has a large <b>kinetic<\/b> store.","As it rises it slows down, so its <b>kinetic store decreases<\/b>.","It gets higher, so its <b>gravitational potential store increases<\/b>.","Answer: the kinetic store of the ball decreases and the gravitational potential store of the ball increases."]},{"type":"bars","title":"Energy in each store as the ball rises (total stays the same)","stores":["Kinetic","Gravitational potential"],"stages":[{"label":"Leaving the hand","values":[100,0]},{"label":"Halfway up","values":[50,50]},{"label":"At the top","values":[0,100]}]},{"type":"steps","title":"A car brakes and stops","steps":["The moving car has a <b>kinetic<\/b> store.","The brakes rub on the wheels. Friction does work, which is a mechanical transfer.","The brakes get hot.","Answer: the kinetic store of the car decreases, energy is transferred mechanically (by friction), and the thermal store of the brakes increases."]},{"type":"steps","title":"An electric kettle boils water","steps":["Energy is transferred <b>electrically<\/b> from the mains to the heating element.","The hot element transfers energy to the water <b>by heating<\/b>.","Answer: energy is transferred electrically and by heating, and the thermal store of the water increases."]}]},{"kind":"Practice","title":"Your turn","minutes":15,"blocks":[{"type":"text","html":"<p>Write full sentences using the sentence frame. Then check.<\/p>"},{"type":"reveal","items":[{"band":"Mild","q":"Which store increases when you stretch a spring?","a":"Elastic potential."},{"band":"Mild","q":"Which store increases when you lift a bag onto a table?","a":"The gravitational potential store of the bag."},{"band":"Mild","q":"Which store increases when soup is heated?","a":"The thermal store of the soup."},{"band":"Medium","q":"A catapult fires a stone. Describe the energy change.","a":"The elastic potential store of the catapult decreases and the kinetic store of the stone increases."},{"band":"Medium","q":"A torch is switched on. Describe the energy transfers.","a":"The chemical store of the battery decreases. Energy is transferred electrically to the bulb, then by light (radiation) and by heating. The thermal store of the surroundings increases."},{"band":"Medium","q":"Wood burns on a fire. Describe the energy change.","a":"The chemical store of the wood decreases and the thermal store of the surroundings increases. Energy is also transferred by light."},{"band":"Spicy","q":"A skier slides down a slope and stops at the bottom. Describe all the energy changes.","a":"The gravitational potential store of the skier decreases and their kinetic store increases. At the bottom, friction and air resistance transfer energy from the kinetic store to the thermal store of the skis, snow and surroundings, until the kinetic store is zero."},{"band":"Spicy","q":"A falling ball hits the ground and stops. Is energy destroyed? Explain.","a":"No. Energy cannot be destroyed. The kinetic store of the ball decreases and the energy is transferred to the thermal store of the ball and ground, and away as sound."}]}]},{"kind":"Exam question","title":"Try it under exam conditions","minutes":7,"blocks":[{"type":"text","html":"<p>Give yourself 5 minutes. Write your answer, then mark it with the mark scheme.<\/p>"},{"type":"exam","id":"313e09b1db"}]},{"kind":"Exit ticket","title":"Check what you learned","minutes":3,"blocks":[{"type":"reveal","items":[{"band":null,"q":"What is a system?","a":"An object or group of objects."},{"band":null,"q":"Name the 4 ways energy can be transferred.","a":"Mechanically, electrically, by heating, by radiation."},{"band":null,"q":"An object is dropped. Which store decreases and which increases?","a":"Gravitational potential decreases, kinetic increases."}]},{"type":"finish"}]}]},{"id":"l2","n":2,"t":"changes","title":"Changes in energy","summary":"Calculating kinetic, gravitational potential and elastic potential energy, and rearranging the equations.","minutes":60,"sections":[{"kind":"Do now","title":"Quick recall","minutes":5,"blocks":[{"type":"reveal","items":[{"band":null,"q":"Which store does a moving object have?","a":"Kinetic."},{"band":null,"q":"Write 500 g in kilograms.","a":"0.5 kg"},{"band":null,"q":"Write 30 cm in metres.","a":"0.3 m"},{"band":null,"q":"What is 4²?","a":"16"}]}]},{"kind":"Learn","title":"Kinetic energy","minutes":8,"blocks":[{"type":"objectives","items":["Calculate kinetic energy, gravitational potential energy and elastic potential energy","Rearrange each equation to find a different quantity","Convert units before using an equation"]},{"type":"text","html":"<p>The energy in an object’s kinetic store depends on its <b>mass<\/b> and its <b>speed<\/b>.<\/p><p>Speed matters much more, because it is <b>squared<\/b>. If the speed doubles, the kinetic energy becomes <b>4 times<\/b> bigger.<\/p>"},{"type":"book","html":"<div class=\"eqn\"><span class=\"mk\">E<sub>k<\/sub> = ½ <span class=\"v\">m<\/span> <span class=\"v\">v<\/span><sup>2<\/sup><\/span><\/div><div class=\"tablewrap\"><table><thead><tr><th>Symbol<\/th><th>Quantity<\/th><th>Unit<\/th><\/tr><\/thead><tbody><tr><td>E<sub>k<\/sub><\/td><td>kinetic energy<\/td><td>joules, J<\/td><\/tr><tr><td><span class=\"v\">m<\/span><\/td><td>mass<\/td><td>kilograms, kg<\/td><\/tr><tr><td><span class=\"v\">v<\/span><\/td><td>speed<\/td><td>metres per second, m/s<\/td><\/tr><\/tbody><\/table><\/div>"},{"type":"tip","html":"<p>Say it out loud: <b>“half m v squared”<\/b>. Only the v is squared, so work out v² first.<\/p>"}]},{"kind":"Worked example","title":"Kinetic energy","minutes":5,"blocks":[{"type":"steps","title":"A 9 kg fox runs at 3 m/s. Calculate its kinetic energy.","steps":["Write the equation: E<sub>k<\/sub> = ½ m v²","Check units: 9 kg and 3 m/s are already in the right units.","Square the speed: 3² = 9","Substitute: E<sub>k<\/sub> = 0.5 × 9 × 9","Answer: <b>40.5 J<\/b>"]}]},{"kind":"Learn","title":"Gravitational potential energy","minutes":6,"blocks":[{"type":"text","html":"<p>Lifting an object increases its gravitational potential store. The energy depends on its <b>mass<\/b>, the <b>height<\/b> it is lifted and the <b>gravitational field strength<\/b>, g.<\/p><p>On Earth, g = <b>9.8 N/kg<\/b>. Use whatever value the question gives you.<\/p>"},{"type":"book","html":"<div class=\"eqn\"><span class=\"mk\">E<sub>p<\/sub> = <span class=\"v\">m<\/span> <span class=\"v\">g<\/span> <span class=\"v\">h<\/span><\/span><\/div><div class=\"tablewrap\"><table><thead><tr><th>Symbol<\/th><th>Quantity<\/th><th>Unit<\/th><\/tr><\/thead><tbody><tr><td>E<sub>p<\/sub><\/td><td>gravitational potential energy<\/td><td>J<\/td><\/tr><tr><td><span class=\"v\">m<\/span><\/td><td>mass<\/td><td>kg<\/td><\/tr><tr><td><span class=\"v\">g<\/span><\/td><td>gravitational field strength<\/td><td>N/kg<\/td><\/tr><tr><td><span class=\"v\">h<\/span><\/td><td>height<\/td><td>m<\/td><\/tr><\/tbody><\/table><\/div>"},{"type":"steps","title":"A 10 kg box is lifted 3 m. Calculate the gravitational potential energy gained. (g = 9.8 N/kg)","steps":["E<sub>p<\/sub> = m g h","E<sub>p<\/sub> = 10 × 9.8 × 3","Answer: <b>294 J<\/b>"]}]},{"kind":"Learn","title":"Elastic potential energy","minutes":6,"blocks":[{"type":"text","html":"<p>Stretching or squashing a spring stores energy in its elastic potential store. It depends on the <b>spring constant<\/b>, k (how stiff the spring is), and the <b>extension<\/b>, e.<\/p><p>This equation only works if the spring has <b>not gone past its limit of proportionality<\/b>.<\/p>"},{"type":"book","html":"<div class=\"eqn\"><span class=\"mk\">E<sub>e<\/sub> = ½ <span class=\"v\">k<\/span> <span class=\"v\">e<\/span><sup>2<\/sup><\/span><\/div><div class=\"tablewrap\"><table><thead><tr><th>Symbol<\/th><th>Quantity<\/th><th>Unit<\/th><\/tr><\/thead><tbody><tr><td>E<sub>e<\/sub><\/td><td>elastic potential energy<\/td><td>J<\/td><\/tr><tr><td><span class=\"v\">k<\/span><\/td><td>spring constant<\/td><td>N/m<\/td><\/tr><tr><td><span class=\"v\">e<\/span><\/td><td>extension<\/td><td>m<\/td><\/tr><\/tbody><\/table><\/div>"},{"type":"steps","title":"A spring (k = 40 N/m) is stretched by 10 cm. Calculate the energy stored.","steps":["Convert first: 10 cm = <b>0.10 m<\/b>","Square the extension: 0.10² = 0.01","E<sub>e<\/sub> = 0.5 × 40 × 0.01","Answer: <b>0.2 J<\/b>"]}]},{"kind":"Learn","title":"Rearranging the equations","minutes":8,"blocks":[{"type":"text","html":"<p>Formula triangles don’t work when something is squared, so rearrange step by step. Do the <b>opposite operation<\/b> to both sides.<\/p><p>Square and square root undo each other. Multiply and divide undo each other.<\/p>"},{"type":"steps","title":"A 2 kg toy car has 98 J of kinetic energy. Find its speed.","steps":["Start: 98 = 0.5 × 2 × v²","0.5 × 2 = 1, so 98 = v²","Square root both sides: v = √98","Answer: <b>9.9 m/s<\/b>"]},{"type":"steps","title":"A 60 kg object has 1000 J of gravitational potential energy. How high is it? (g = 9.8 N/kg)","steps":["Start: 1000 = 60 × 9.8 × h","60 × 9.8 = 588, so 1000 = 588 × h","Divide both sides by 588: h = 1000 ÷ 588","Answer: <b>1.7 m<\/b>"]},{"type":"book","html":"<div class=\"tablewrap\"><table><thead><tr><th>To find<\/th><th>Use<\/th><\/tr><\/thead><tbody><tr><td>speed<\/td><td><span class=\"v\">v<\/span> = √(2E<sub>k<\/sub> ÷ <span class=\"v\">m<\/span>)<\/td><\/tr><tr><td>mass (from E<sub>k<\/sub>)<\/td><td><span class=\"v\">m<\/span> = 2E<sub>k<\/sub> ÷ <span class=\"v\">v<\/span>²<\/td><\/tr><tr><td>height<\/td><td><span class=\"v\">h<\/span> = E<sub>p<\/sub> ÷ (<span class=\"v\">m<\/span> <span class=\"v\">g<\/span>)<\/td><\/tr><tr><td>spring constant<\/td><td><span class=\"v\">k<\/span> = 2E<sub>e<\/sub> ÷ <span class=\"v\">e<\/span>²<\/td><\/tr><tr><td>extension<\/td><td><span class=\"v\">e<\/span> = √(2E<sub>e<\/sub> ÷ <span class=\"v\">k<\/span>)<\/td><\/tr><\/tbody><\/table><\/div>"}]},{"kind":"Remember it","title":"Lock in the equations","minutes":3,"blocks":[{"type":"memory","eqs":["ek","ep","ee"]}]},{"kind":"Practice","title":"Your turn","minutes":12,"blocks":[{"type":"text","html":"<p>Type your answer, then press Check. Use a calculator and write your working on paper.<\/p>"},{"type":"calc","items":[{"band":"Mild","id":"69d20b1fc5"},{"band":"Mild","id":"30d88cb68d"},{"band":"Medium","id":"b90932f40b"},{"band":"Medium","id":"71a916ea38"},{"band":"Spicy","id":"c3db906f8e"},{"band":"Spicy","id":"a5e165fce5"}]}]},{"kind":"Exam question","title":"Two-step calculation","minutes":5,"blocks":[{"type":"exam","id":"1f367db0f9"}]},{"kind":"Exit ticket","title":"Check what you learned","minutes":2,"blocks":[{"type":"reveal","items":[{"band":null,"q":"Write the equation for kinetic energy.","a":"E<sub>k<\/sub> = ½ m v²"},{"band":null,"q":"What must you do to a mass given in grams?","a":"Divide by 1000 to get kilograms."},{"band":null,"q":"A spring’s extension doubles. What happens to the energy stored?","a":"It becomes 4 times bigger (extension is squared)."}]},{"type":"finish"}]}]},{"id":"l3","n":3,"t":"shc","title":"Energy changes in systems: specific heat capacity","summary":"What decides how much something warms up, what specific heat capacity means, and using ΔE = m c Δθ.","minutes":60,"sections":[{"kind":"Do now","title":"Quick recall","minutes":5,"blocks":[{"type":"reveal","items":[{"band":null,"q":"Calculate the kinetic energy of a 2 kg ball moving at 3 m/s.","a":"0.5 × 2 × 3² = 9 J"},{"band":null,"q":"Which store increases when water is heated?","a":"The thermal store of the water."},{"band":null,"q":"What is the unit of temperature we use in physics at GCSE?","a":"Degrees Celsius, °C."},{"band":null,"q":"What does the symbol Δ mean?","a":"“Change in”."}]}]},{"kind":"Learn","title":"What decides the temperature rise?","minutes":8,"blocks":[{"type":"objectives","items":["Explain what specific heat capacity means","Calculate energy, mass, specific heat capacity or temperature change using ΔE = m c Δθ","Explain why different materials heat up by different amounts"]},{"type":"text","html":"<p>Think about boiling a kettle. A <b>full<\/b> kettle takes longer than a half-full one. More mass needs more energy.<\/p><p>Now think about a metal spoon and some water given the <b>same<\/b> energy. The spoon gets much hotter. Different materials need different amounts of energy.<\/p>"},{"type":"book","html":"<p>The temperature rise of a system depends on:<\/p><ul><li>the <b>energy<\/b> put in<\/li><li>the <b>mass<\/b> of the substance<\/li><li><b>what the substance is<\/b> (its specific heat capacity)<\/li><\/ul>"}]},{"kind":"Learn","title":"Specific heat capacity","minutes":10,"blocks":[{"type":"book","html":"<p><b>Specific heat capacity<\/b> is the amount of energy needed to raise the temperature of <b>1 kg<\/b> of a substance by <b>1 °C<\/b>.<\/p><p>Unit: <b>J/kg °C<\/b><\/p>"},{"type":"text","html":"<div class=\"tablewrap\"><table><thead><tr><th>Substance<\/th><th>Specific heat capacity (approx.)<\/th><\/tr><\/thead><tbody><tr><td>Water<\/td><td>4200 J/kg °C<\/td><\/tr><tr><td>Cooking oil<\/td><td>2000 J/kg °C<\/td><\/tr><tr><td>Aluminium<\/td><td>900 J/kg °C<\/td><\/tr><tr><td>Iron<\/td><td>450 J/kg °C<\/td><\/tr><tr><td>Copper<\/td><td>385 J/kg °C<\/td><\/tr><\/tbody><\/table><\/div>"},{"type":"text","html":"<p>Water has a <b>high<\/b> specific heat capacity: 4200 J to warm 1 kg by 1 °C. So water heats up slowly, cools down slowly and stores a lot of energy. That is why it is used in radiators and hot water bottles.<\/p><p>Copper has a <b>low<\/b> specific heat capacity, so the same energy makes it much hotter.<\/p>"}]},{"kind":"Learn","title":"The equation","minutes":5,"blocks":[{"type":"book","html":"<div class=\"eqn\"><span class=\"mk\">Δ<span class=\"v\">E<\/span> = <span class=\"v\">m<\/span> <span class=\"v\">c<\/span> Δ<span class=\"v\">θ<\/span><\/span><\/div><div class=\"tablewrap\"><table><thead><tr><th>Symbol<\/th><th>Quantity<\/th><th>Unit<\/th><\/tr><\/thead><tbody><tr><td>Δ<span class=\"v\">E<\/span><\/td><td>change in thermal energy<\/td><td>J<\/td><\/tr><tr><td><span class=\"v\">m<\/span><\/td><td>mass<\/td><td>kg<\/td><\/tr><tr><td><span class=\"v\">c<\/span><\/td><td>specific heat capacity<\/td><td>J/kg °C<\/td><\/tr><tr><td>Δ<span class=\"v\">θ<\/span><\/td><td>temperature change<\/td><td>°C<\/td><\/tr><\/tbody><\/table><\/div>"},{"type":"memory","eqs":["shc"]}]},{"kind":"Worked example","title":"Using ΔE = m c Δθ","minutes":8,"blocks":[{"type":"steps","title":"How much energy is needed to heat 2 kg of water from 20 °C to 70 °C? (c = 4200 J/kg °C)","steps":["Temperature change: Δθ = 70 − 20 = <b>50 °C<\/b>","ΔE = m c Δθ = 2 × 4200 × 50","Answer: <b>420 000 J<\/b>"]},{"type":"steps","title":"A 0.5 kg block warms by 20 °C when given 9000 J. Find its specific heat capacity.","steps":["Start: 9000 = 0.5 × c × 20","0.5 × 20 = 10, so 9000 = 10 × c","c = 9000 ÷ 10","Answer: <b>900 J/kg °C<\/b>"]}]},{"kind":"Practice","title":"Your turn","minutes":13,"blocks":[{"type":"calc","items":[{"band":"Mild","id":"271a5c474e"},{"band":"Mild","id":"dfeb1d3501"},{"band":"Medium","id":"03d99cfdcc"},{"band":"Medium","id":"d037e4c593"},{"band":"Spicy","id":"f5a94a8caa"},{"band":"Spicy","id":"0923826872"}]}]},{"kind":"Exam question","title":"Explain and calculate","minutes":8,"blocks":[{"type":"exam","id":"e81f876505"},{"type":"exam","id":"47068dfab8"}]},{"kind":"Exit ticket","title":"Check what you learned","minutes":3,"blocks":[{"type":"reveal","items":[{"band":null,"q":"Define specific heat capacity.","a":"The energy needed to raise the temperature of 1 kg of a substance by 1 °C."},{"band":null,"q":"Water goes from 15 °C to 40 °C. What is Δθ?","a":"25 °C"},{"band":null,"q":"Which heats up more with the same energy: 1 kg of water or 1 kg of copper?","a":"Copper, because it has a lower specific heat capacity."}]},{"type":"finish"}]}]},{"id":"l4","n":4,"t":"power","title":"Power and work done","summary":"What power means, calculating it from energy or work done, and the work done equation.","minutes":60,"sections":[{"kind":"Do now","title":"Quick recall","minutes":5,"blocks":[{"type":"reveal","items":[{"band":null,"q":"Write the equation that links change in thermal energy, mass, specific heat capacity and temperature change.","a":"ΔE = m c Δθ"},{"band":null,"q":"How many seconds are in 2 minutes?","a":"120 s"},{"band":null,"q":"What is the unit of energy?","a":"The joule (J)."},{"band":null,"q":"What does “rate” mean in science?","a":"How quickly something happens, usually per second."}]}]},{"kind":"Learn","title":"What is power?","minutes":10,"blocks":[{"type":"objectives","items":["Define power","Calculate power using P = E ÷ t and P = W ÷ t","Calculate work done using W = F s","Compare the power of two machines"]},{"type":"text","html":"<p>Two students of the same mass run up the same stairs. One takes 5 seconds, the other takes 10 seconds. They both gain the <b>same<\/b> gravitational potential energy, so they both transfer the same energy.<\/p><p>The faster student is <b>more powerful<\/b>, because they transferred the energy in <b>less time<\/b>.<\/p>"},{"type":"book","html":"<p><b>Power<\/b> is the rate at which energy is transferred, or the rate at which work is done.<\/p><p>Power is measured in <b>watts (W)<\/b>. <b>1 watt = 1 joule per second.<\/b><\/p>"},{"type":"text","html":"<p>A 60 W bulb transfers 60 J every second. A 2000 W kettle transfers 2000 J every second.<\/p>"}]},{"kind":"Learn","title":"The power equations","minutes":6,"blocks":[{"type":"book","html":"<div class=\"eqn\"><span class=\"mk\"><span class=\"v\">P<\/span> = <span class=\"fr\"><span><span class=\"v\">E<\/span><\/span><span><span class=\"v\">t<\/span><\/span><\/span><\/span><\/div><div class=\"eqn\"><span class=\"mk\"><span class=\"v\">P<\/span> = <span class=\"fr\"><span><span class=\"v\">W<\/span><\/span><span><span class=\"v\">t<\/span><\/span><\/span><\/span><\/div><div class=\"tablewrap\"><table><thead><tr><th>Symbol<\/th><th>Quantity<\/th><th>Unit<\/th><\/tr><\/thead><tbody><tr><td><span class=\"v\">P<\/span><\/td><td>power<\/td><td>watts, W<\/td><\/tr><tr><td><span class=\"v\">E<\/span><\/td><td>energy transferred<\/td><td>J<\/td><\/tr><tr><td><span class=\"v\">W<\/span><\/td><td>work done<\/td><td>J<\/td><\/tr><tr><td><span class=\"v\">t<\/span><\/td><td>time<\/td><td>seconds, s<\/td><\/tr><\/tbody><\/table><\/div>"},{"type":"tip","html":"<p><b>Convert first.<\/b> kW → W: × 1000. Minutes → seconds: × 60. kJ → J: × 1000.<\/p>"},{"type":"text","html":"<p>Formula triangle: put E at the top and P × t underneath. Cover the one you want:<\/p><ul><li>P = E ÷ t<\/li><li>E = P × t<\/li><li>t = E ÷ P<\/li><\/ul>"}]},{"kind":"Learn","title":"Work done","minutes":6,"blocks":[{"type":"text","html":"<p>When a force moves an object, energy is transferred. This is called <b>work done<\/b>.<\/p><p>Work done against <b>friction<\/b> makes surfaces warm up, like rubbing your hands together.<\/p>"},{"type":"book","html":"<div class=\"eqn\"><span class=\"mk\"><span class=\"v\">W<\/span> = <span class=\"v\">F<\/span> <span class=\"v\">s<\/span><\/span><\/div><div class=\"tablewrap\"><table><thead><tr><th>Symbol<\/th><th>Quantity<\/th><th>Unit<\/th><\/tr><\/thead><tbody><tr><td><span class=\"v\">W<\/span><\/td><td>work done<\/td><td>J<\/td><\/tr><tr><td><span class=\"v\">F<\/span><\/td><td>force<\/td><td>N<\/td><\/tr><tr><td><span class=\"v\">s<\/span><\/td><td>distance moved along the line of the force<\/td><td>m<\/td><\/tr><\/tbody><\/table><\/div><p>1 joule = 1 newton metre (1 J = 1 N m)<\/p>"}]},{"kind":"Remember it","title":"Lock in the equations","minutes":3,"blocks":[{"type":"memory","eqs":["pe","pw","wf"]}]},{"kind":"Worked example","title":"Power calculations","minutes":8,"blocks":[{"type":"steps","title":"A 2 kW kettle is switched on for 3 minutes. How much energy does it transfer?","steps":["Convert: 2 kW = <b>2000 W<\/b>, 3 minutes = <b>180 s<\/b>","Rearrange: E = P × t","E = 2000 × 180","Answer: <b>360 000 J<\/b>"]},{"type":"steps","title":"A crane lifts a 500 kg load through 12 m in 30 s. Calculate its power. (g = 9.8 N/kg)","steps":["Step 1, energy transferred: E<sub>p<\/sub> = m g h = 500 × 9.8 × 12 = <b>58 800 J<\/b>","Step 2, power: P = E ÷ t = 58 800 ÷ 30","Answer: <b>1960 W<\/b>"]}]},{"kind":"Practice","title":"Your turn","minutes":12,"blocks":[{"type":"calc","items":[{"band":"Mild","id":"a9016e334b"},{"band":"Mild","id":"24eed1d190"},{"band":"Medium","id":"93fe08af98"},{"band":"Medium","id":"4a38060fae"},{"band":"Spicy","id":"c9d292518c"},{"band":"Spicy","id":"b4ae061f57"}]}]},{"kind":"Exam question","title":"Explain and calculate","minutes":7,"blocks":[{"type":"exam","id":"8445bddbaf"},{"type":"exam","id":"60aebf40af"}]},{"kind":"Exit ticket","title":"Check what you learned","minutes":3,"blocks":[{"type":"reveal","items":[{"band":null,"q":"Define power.","a":"The rate at which energy is transferred (or work is done)."},{"band":null,"q":"What is 1 watt?","a":"1 joule per second."},{"band":null,"q":"Motor A lifts a load in 10 s. Motor B lifts the same load in 20 s. Which is more powerful?","a":"Motor A. Same energy, less time."}]},{"type":"finish"}]}]},{"id":"l5","n":5,"t":"transfers","title":"Energy transfers in a system","summary":"Conservation of energy, wasted (dissipated) energy, and how to reduce unwanted energy transfers.","minutes":60,"sections":[{"kind":"Do now","title":"Quick recall","minutes":5,"blocks":[{"type":"reveal","items":[{"band":null,"q":"In P = E ÷ t, what unit is t measured in?","a":"Seconds (s)."},{"band":null,"q":"Name 4 energy stores.","a":"Any 4 of: kinetic, gravitational potential, elastic potential, thermal, chemical, magnetic, electrostatic, nuclear."},{"band":null,"q":"Which force slows down objects sliding along a surface?","a":"Friction."},{"band":null,"q":"Which store increases when something warms up?","a":"Thermal."}]}]},{"kind":"Learn","title":"Conservation of energy","minutes":8,"blocks":[{"type":"objectives","items":["State the law of conservation of energy","Describe useful and wasted energy transfers","Explain how lubrication and insulation reduce unwanted energy transfers","Explain how wall thickness and thermal conductivity affect how fast a building cools"]},{"type":"book","html":"<p><b>Law of conservation of energy:<\/b> energy can be transferred usefully, stored or dissipated, but it <b>cannot be created or destroyed<\/b>.<\/p><p>In a <b>closed system<\/b> there is no net change to the total energy.<\/p>"},{"type":"tip","html":"<p>Never write “energy is lost” or “energy is used up” on its own. Say where the energy goes, for example “to the thermal store of the surroundings”.<\/p>"}]},{"kind":"Learn","title":"Useful and wasted energy","minutes":10,"blocks":[{"type":"text","html":"<p>Every time energy is transferred, some of it spreads out into the surroundings, usually by heating. We say it has been <b>dissipated<\/b>. It is still there, but it is stored in a way that is much less useful. People often call it <b>wasted<\/b> energy.<\/p>"},{"type":"split","title":"A lamp is supplied with 100 J","total":100,"unit":"J","parts":[["Useful: light",20],["Wasted: heating the surroundings",80]]},{"type":"text","html":"<div class=\"tablewrap\"><table><thead><tr><th>Device<\/th><th>Useful energy transfer<\/th><th>Wasted energy transfer<\/th><\/tr><\/thead><tbody><tr><td>Electric kettle<\/td><td>thermal store of the water<\/td><td>thermal store of the kettle and air, sound<\/td><\/tr><tr><td>Phone charger<\/td><td>chemical store of the phone battery<\/td><td>thermal store of the charger and surroundings<\/td><\/tr><tr><td>Car<\/td><td>kinetic store of the car<\/td><td>thermal store of the engine and surroundings, sound<\/td><\/tr><tr><td>Electric fan<\/td><td>kinetic store of the blades and air<\/td><td>thermal store of the motor, sound<\/td><\/tr><\/tbody><\/table><\/div>"},{"type":"book","html":"<p><b>Dissipated<\/b> energy has spread out to the surroundings and is stored in less useful ways. In all system changes some energy is dissipated.<\/p>"}]},{"kind":"Learn","title":"Reducing unwanted energy transfers","minutes":10,"blocks":[{"type":"text","html":"<p>There are two main ways to reduce unwanted energy transfers:<\/p><ul><li><b>Lubrication<\/b>: oil or grease reduces friction between moving parts, so less energy goes to thermal stores.<\/li><li><b>Thermal insulation<\/b>: materials that slow down energy transfer by heating.<\/li><\/ul>"},{"type":"text","html":"<p>The higher the <b>thermal conductivity<\/b> of a material, the faster energy is transferred through it by conduction. Metals have a high thermal conductivity. Plastic, wood, air and foam have a low thermal conductivity. That is why saucepans are metal but have plastic handles.<\/p>"},{"type":"book","html":"<p>A building cools more slowly if its walls are <b>thicker<\/b> and made of a material with a <b>lower thermal conductivity<\/b>.<\/p>"},{"type":"text","html":"<p>Ways to keep a house warm:<\/p><ul><li>Loft insulation<\/li><li>Cavity wall insulation (foam in the gap between the two walls)<\/li><li>Double glazing<\/li><li>Draught excluders<\/li><\/ul>"}]},{"kind":"Worked example","title":"Explaining a situation","minutes":5,"blocks":[{"type":"steps","title":"A swinging pendulum slowly stops. Explain what happens to its energy.","steps":["Energy moves between the <b>gravitational potential<\/b> and <b>kinetic<\/b> stores as it swings.","Each swing, <b>air resistance<\/b> and <b>friction<\/b> at the pivot do work.","This transfers energy to the <b>thermal store of the surroundings<\/b>: it is dissipated.","Answer: the energy is not destroyed. It is dissipated to the surroundings until the pendulum stops."]}]},{"kind":"Practice","title":"Your turn","minutes":12,"blocks":[{"type":"reveal","items":[{"band":"Mild","q":"Give 2 ways to reduce unwanted energy transfers.","a":"Lubrication and thermal insulation."},{"band":"Mild","q":"Which has the higher thermal conductivity: copper or plastic?","a":"Copper."},{"band":"Medium","q":"Describe the useful and wasted energy transfers in a hairdryer.","a":"Useful: the thermal store of the air and the kinetic store of the air (from the fan). Wasted: sound, and the thermal store of the hairdryer’s casing and motor."},{"band":"Medium","q":"Why do saucepans have plastic handles?","a":"Plastic has a low thermal conductivity, so energy is transferred to the handle slowly and it stays cool enough to hold."},{"band":"Spicy","q":"Two houses have walls made of the same material. House A’s walls are twice as thick. Which house cools faster, and why?","a":"House B, because thinner walls transfer energy by conduction at a higher rate."},{"band":"Spicy","q":"A student writes: “When a car brakes, its energy is lost.” Rewrite this so it would get the mark.","a":"The kinetic store of the car decreases and energy is transferred to the thermal store of the brakes and surroundings. The energy is dissipated, not destroyed."}]}]},{"kind":"Exam question","title":"Explain","minutes":7,"blocks":[{"type":"exam","id":"f5969101eb"},{"type":"exam","id":"8bed9b458a"}]},{"kind":"Exit ticket","title":"Check what you learned","minutes":3,"blocks":[{"type":"reveal","items":[{"band":null,"q":"State the law of conservation of energy.","a":"Energy can be transferred usefully, stored or dissipated, but cannot be created or destroyed."},{"band":null,"q":"What does “dissipated” mean?","a":"Spread out to the surroundings and stored in less useful ways."},{"band":null,"q":"How does lubrication reduce wasted energy?","a":"It reduces friction, so less energy is transferred to thermal stores."}]},{"type":"finish"}]}]},{"id":"l6","n":6,"t":"efficiency","title":"Efficiency","summary":"Calculating efficiency from energy or power, finding wasted, useful or total energy, and ways to improve efficiency.","minutes":60,"sections":[{"kind":"Do now","title":"Quick recall","minutes":5,"blocks":[{"type":"reveal","items":[{"band":null,"q":"State the law of conservation of energy.","a":"Energy cannot be created or destroyed, only transferred, stored or dissipated."},{"band":null,"q":"Give one way to reduce unwanted energy transfers.","a":"Lubrication or thermal insulation."},{"band":null,"q":"Write 0.35 as a percentage.","a":"35 %"},{"band":null,"q":"Work out 450 ÷ 900.","a":"0.5"}]}]},{"kind":"Learn","title":"What efficiency means","minutes":8,"blocks":[{"type":"objectives","items":["Calculate efficiency using energy or power","Write efficiency as a decimal or a percentage","Work out wasted, useful or total input energy","Describe ways to increase efficiency (Higher)"]},{"type":"text","html":"<p>Efficiency tells you what <b>fraction<\/b> of the energy put in is transferred <b>usefully<\/b>.<\/p>"},{"type":"split","title":"A kettle is supplied with 800 J","total":800,"unit":"J","parts":[["Useful: heating the water",450],["Wasted: heating the kettle and air",350]]},{"type":"book","html":"<div class=\"eqn\"><span class=\"mk\">efficiency = <span class=\"fr\"><span>useful output energy transfer<\/span><span>total input energy transfer<\/span><\/span><\/span><\/div><div class=\"eqn\"><span class=\"mk\">efficiency = <span class=\"fr\"><span>useful power output<\/span><span>total power input<\/span><\/span><\/span><\/div><p>Efficiency has <b>no unit<\/b>. Multiply by 100 to give a percentage.<\/p>"},{"type":"tip","html":"<p>Your answer must be <b>less than 1<\/b> (or less than 100 %). If it isn’t, you divided the wrong way round.<\/p>"}]},{"kind":"Learn","title":"Wasted, useful and total","minutes":6,"blocks":[{"type":"book","html":"<ul><li>wasted = total input − useful output<\/li><li>total input = useful output + wasted<\/li><li>useful output = efficiency × total input<\/li><li>total input = useful output ÷ efficiency<\/li><\/ul>"},{"type":"tip","html":"<p>If the efficiency is a percentage, change it to a decimal first: 60 % = 0.6.<\/p>"}]},{"kind":"Remember it","title":"Lock in the equations","minutes":3,"blocks":[{"type":"memory","eqs":["eff","effp"]}]},{"kind":"Worked example","title":"Efficiency calculations","minutes":8,"blocks":[{"type":"steps","title":"A kettle takes in 800 J. 450 J heats the water. Calculate its efficiency.","steps":["efficiency = useful ÷ total","= 450 ÷ 800","Answer: <b>0.5625<\/b>, which is <b>56 %<\/b>","Wasted energy = 800 − 450 = 350 J"]},{"type":"steps","title":"A motor is 60 % efficient and is supplied with 500 J. How much energy is useful?","steps":["60 % = 0.6","useful = efficiency × total = 0.6 × 500","Answer: <b>300 J<\/b>"]},{"type":"steps","title":"A lamp has an efficiency of 0.25 and a useful power output of 150 W. Find its total power input.","steps":["total = useful ÷ efficiency","= 150 ÷ 0.25","Answer: <b>600 W<\/b>"]}]},{"kind":"Learn","title":"Increasing efficiency (Higher)","minutes":6,"blocks":[{"type":"book","html":"<ul><li><b>Lubricate<\/b> moving parts to reduce friction<\/li><li><b>Insulate<\/b> to reduce energy transferred by heating<\/li><li><b>Streamline<\/b> vehicles to reduce air resistance<\/li><li>Use parts that waste less energy, such as LED bulbs<\/li><\/ul>"},{"type":"text","html":"<p>No device can be 100 % efficient, because some energy is <b>always<\/b> dissipated. An efficiency above 100 % would mean energy had been created, which is impossible.<\/p>"}]},{"kind":"Practice","title":"Your turn","minutes":13,"blocks":[{"type":"calc","items":[{"band":"Mild","id":"c7e464571b"},{"band":"Mild","id":"ef60735196"},{"band":"Medium","id":"dcea0f2e7a"},{"band":"Medium","id":"14888278f8"},{"band":"Spicy","id":"e9e989775c"},{"band":"Spicy","id":"bc3cab7a9f"}]}]},{"kind":"Exam question","title":"Higher tier","minutes":8,"blocks":[{"type":"exam","id":"6c4ecbc274"},{"type":"exam","id":"b99dd2b5b9"}]},{"kind":"Exit ticket","title":"Check what you learned","minutes":3,"blocks":[{"type":"reveal","items":[{"band":null,"q":"Write the efficiency equation using energy.","a":"efficiency = useful output energy transfer ÷ total input energy transfer"},{"band":null,"q":"A device is 0.8 efficient. Write this as a percentage.","a":"80 %"},{"band":null,"q":"Why can nothing be more than 100 % efficient?","a":"That would mean creating energy, which is impossible."}]},{"type":"finish"}]}]}]}</script>
<script>
(function () {
"use strict";
const D = JSON.parse(document.getElementById("site-data").textContent);
const KEY = "energy-revision:v1";
const $view = document.getElementById("view");

/* ---------- storage (falls back to memory if the browser blocks it) ---------- */
const mem = {};
function load(k, fb) {
  try { const v = localStorage.getItem(KEY + ":" + k); return v === null ? fb : JSON.parse(v); }
  catch (e) { return k in mem ? mem[k] : fb; }
}
const ST = {
  marks: load("marks", {}), calc: load("calc", {}), exam: load("exam", {}), tests: load("tests", []),
  draft: load("draft", null), eq: load("eq", {}), lessons: load("lessons", {}), rag: load("rag", {}), prefs: load("prefs", {})
};
function save(k) {
  mem[k] = ST[k];
  try { localStorage.setItem(KEY + ":" + k, JSON.stringify(ST[k])); } catch (e) { /* private mode */ }
}

/* ---------- lookups ---------- */
const byId = (list) => Object.fromEntries(list.map((x) => [x.id, x]));
const TOPIC = byId(D.topics), CALC = byId(D.calc), EXAM = byId(D.exam), EQ = byId(D.equations), LESSON = byId(D.lessons);
const CARD = byId(D.cards);

/* ---------- small helpers ---------- */
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const strip = (s) => String(s || "").replace(/<[^>]+>/g, "");
const plural = (n, w) => n + " " + w + (n === 1 ? "" : "s");
function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function testDate() { const [y, m, d] = D.test.date.split("-").map(Number); return new Date(y, m - 1, d); }
function today() { const t = new Date(); t.setHours(0, 0, 0, 0); return t; }
function daysLeft() { return Math.round((testDate() - today()) / 86400000); }
const longDate = (d) => d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
const shortDate = (d) => d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
const mmss = (s) => { const a = Math.abs(Math.round(s)); return (s < 0 ? "−" : "") + Math.floor(a / 60) + ":" + String(a % 60).padStart(2, "0"); };

/* ---------- number checking ---------- */
function parseNum(str) {
  let s = String(str || "").trim().toLowerCase().replace(/,/g, "").replace(/\s+/g, "");
  s = s.replace(/(\d)(?:×|x|\*)10\^?(−|-)?(\d+)/, (_, d, neg, p) => d + "e" + (neg ? "-" : "") + p);
  s = s.replace(/−/g, "-");
  const m = s.match(/-?\d*\.?\d+(?:e-?\d+)?/);
  return m ? { value: parseFloat(m[0]), text: m[0] } : null;
}
function sigFigs(text) {
  let t = text.replace(/^-/, "").split("e")[0];
  if (t.includes(".")) { t = t.replace(".", "").replace(/^0+/, ""); return Math.max(t.length, 1); }
  t = t.replace(/^0+/, "").replace(/0+$/, "");
  return Math.max(t.length, 1);
}
function roundSF(x, n) {
  if (x === 0) return 0;
  const p = Math.pow(10, n - Math.ceil(Math.log10(Math.abs(x))));
  return Math.round(x * p) / p;
}
function matches(x, text, exact) {
  if (exact === 0) return Math.abs(x) < 1e-9;
  if (Math.abs(x - exact) / Math.abs(exact) < 0.005) return true;
  const sf = Math.max(2, sigFigs(text));
  const r = roundSF(exact, sf);
  return Math.abs(x - r) <= Math.abs(r) * 1e-9;
}
function checkNum(input, exacts) {
  const n = parseNum(input);
  if (!n) return { state: "empty", msg: "Type a number first." };
  const x = n.value;
  if (exacts.some((a) => matches(x, n.text, a))) return { state: "ok", msg: "✓ Correct." };
  if (exacts.some((a) => matches(x * 1000, n.text, a) || matches(x / 1000, n.text, a)))
    return { state: "close", msg: "Nearly. Your number is 1000 times too big or too small. Check your units (kJ, kW, g, km)." };
  if (exacts.some((a) => a !== 0 && Math.abs(x - a) / Math.abs(a) < 0.1))
    return { state: "close", msg: "Close, but not quite. Check your rounding, or keep more decimal places until the end." };
  return { state: "no", msg: "✗ Not right yet. Have another go, or open the hint." };
}

/* ---------- shared blocks ---------- */
const BAND_OF = { 1: "One step", 2: "Two steps" };

function calcHTML(id, band) {
  const c = CALC[id], s = ST.calc[id] || {};
  const done = s.ok ? ' <span class="tick" title="You got this right">✓</span>' : "";
  const label = band ? `<span class="band ${band}">${band}</span>` : (c.lvl === 2 ? '<span class="band Spicy">Two steps</span>' : "");
  return `<div class="calc" data-calc="${id}">
    <p class="q">${label}${c.q}${done}</p>
    <div class="answer-row">
      <label class="sr" for="in-${id}">Your answer</label>
      <input id="in-${id}" inputmode="decimal" autocomplete="off" value="${esc(s.last || "")}" placeholder="Answer">
      <span class="unit">${c.unit}</span>
      <button class="btn small primary" data-act="calc-check">Check</button>
      <button class="btn small" data-act="calc-hint">Hint</button>
      <button class="btn small" data-act="calc-work">Show working</button>
    </div>
    <p class="fb" hidden></p>
    <p class="hint" hidden>${c.hint}</p>
    <div class="work" hidden><p class="working">${c.work.join("<br>")}</p></div>
  </div>`;
}
function calcCheck(box) {
  const id = box.dataset.calc, c = CALC[id], val = box.querySelector("input").value;
  const r = checkNum(val, [c.ans].concat(c.alt || []));
  const fb = box.querySelector(".fb");
  fb.hidden = false;
  fb.className = "fb " + ({ ok: "ok", close: "close", no: "no", empty: "no" }[r.state]);
  fb.textContent = r.msg;
  if (r.state === "empty") return;
  const s = ST.calc[id] || { tries: 0 };
  s.tries += 1; s.last = val;
  if (r.state === "ok") { s.ok = true; box.querySelector(".work").hidden = false; }
  ST.calc[id] = s; save("calc");
}

function examHTML(id) {
  const q = EXAM[id], s = ST.exam[id] || {};
  const got = s.got || [];
  const ht = q.ht ? ' <span class="pill ht">Higher</span>' : "";
  const pts = q.points.map((p, i) => `<label><input type="checkbox" data-pt="${i}" ${got.includes(i) ? "checked" : ""}><span>${p}</span></label>`).join("");
  const levels = q.levels ? `<div class="levels tablewrap"><table><thead><tr><th>Level</th><th>Marks</th><th>What the answer looks like</th></tr></thead><tbody>${q.levels.map((l) => `<tr><td>${l[0]}</td><td>${l[1]}</td><td>${l[2]}</td></tr>`).join("")}</tbody></table></div>` : "";
  return `<div class="examq" data-exam="${id}">
    <div class="qtext"><p>${q.q}${ht}</p><span class="marks">[${q.marks} marks]</span></div>
    <label class="sr" for="ta-${id}">Your answer</label>
    <textarea id="ta-${id}" placeholder="Write your answer here">${esc(s.text || "")}</textarea>
    <div class="row"><button class="btn small" data-act="exam-scheme">${s.open ? "Hide" : "Show"} mark scheme</button>
      ${s.score != null ? `<span class="small muted">Your mark: <b>${s.score}/${q.marks}</b></span>` : ""}</div>
    <div class="scheme" ${s.open ? "" : "hidden"}>
      <h4>Mark scheme · tick each point you made</h4>
      ${q.note ? `<p class="small muted">${q.note}</p>` : ""}
      ${pts}${levels}
      <p class="total">Your mark: <span class="score">${Math.min(got.length, q.max)}</span>/${q.marks}</p>
    </div>
  </div>`;
}
function examScore(box) {
  const id = box.dataset.exam, q = EXAM[id];
  const got = [...box.querySelectorAll("[data-pt]")].filter((x) => x.checked).map((x) => +x.dataset.pt);
  let score = Math.min(got.length, q.max);
  if (q.levels) score = Math.min(q.marks, Math.round(got.length * q.marks / q.points.length));
  const s = ST.exam[id] || {};
  s.got = got; s.score = score; ST.exam[id] = s; save("exam");
  box.querySelector(".score").textContent = score;
}

function ragHTML(topicId) {
  const v = ST.rag[topicId] || "";
  const names = { r: "Red: not confident", a: "Amber: getting there", g: "Green: confident" };
  return `<span class="rag" role="group" aria-label="Confidence for ${esc(TOPIC[topicId].name)}">${["r", "a", "g"].map((k) =>
    `<button type="button" data-rag="${topicId}" data-v="${k}" aria-pressed="${v === k}" title="${names[k]}">${k.toUpperCase()}</button>`).join("")}</span>`;
}

/* common click handling used by every view */
function commonClick(e) {
  const t = e.target.closest("[data-act],[data-rag]");
  if (!t) return false;
  if (t.dataset.rag) {
    const cur = ST.rag[t.dataset.rag];
    ST.rag[t.dataset.rag] = cur === t.dataset.v ? "" : t.dataset.v; save("rag");
    t.parentElement.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(ST.rag[t.dataset.rag] === b.dataset.v)));
    return true;
  }
  const act = t.dataset.act;
  const calcBox = t.closest("[data-calc]");
  const examBox = t.closest("[data-exam]");
  if (act === "calc-check") { calcCheck(calcBox); return true; }
  if (act === "calc-hint") { const h = calcBox.querySelector(".hint"); h.hidden = !h.hidden; return true; }
  if (act === "calc-work") { const w = calcBox.querySelector(".work"); w.hidden = !w.hidden; return true; }
  if (act === "exam-scheme") {
    const s = ST.exam[examBox.dataset.exam] || {}; s.open = !s.open; ST.exam[examBox.dataset.exam] = s; save("exam");
    examBox.querySelector(".scheme").hidden = !s.open; t.textContent = (s.open ? "Hide" : "Show") + " mark scheme"; return true;
  }
  if (act === "reveal") {
    const a = t.closest("li").querySelector(".ans"); a.hidden = !a.hidden;
    t.textContent = a.hidden ? "Show answer" : "Hide answer"; return true;
  }
  if (act === "step-next" || act === "step-all") {
    const box = t.closest(".worked"), items = [...box.querySelectorAll("li")];
    const hiddenOnes = items.filter((li) => li.hidden);
    if (act === "step-all") hiddenOnes.forEach((li) => { li.hidden = false; }); else if (hiddenOnes[0]) hiddenOnes[0].hidden = false;
    if (!items.some((li) => li.hidden)) box.querySelector(".ctrl").hidden = true;
    return true;
  }
  if (act === "eq-show") { const x = t.closest("[data-eqshow]").querySelector(".eqhide"); x.hidden = !x.hidden; t.textContent = x.hidden ? "Show it" : "Hide it"; return true; }
  return false;
}
function commonInput(e) {
  const ta = e.target.closest("[data-exam] textarea");
  if (ta) {
    const id = ta.closest("[data-exam]").dataset.exam;
    const s = ST.exam[id] || {}; s.text = ta.value; ST.exam[id] = s; save("exam");
  }
  const cb = e.target.closest("[data-exam] [data-pt]");
  if (cb) examScore(cb.closest("[data-exam]"));
}
function commonKey(e) {
  if (e.key === "Enter" && e.target.matches("[data-calc] input")) { e.preventDefault(); calcCheck(e.target.closest("[data-calc]")); }
}

/* progress numbers used by the dashboard and lists */
function topicStats(tid) {
  const cards = D.cards.filter((c) => c.t === tid);
  const calcs = D.calc.filter((c) => c.t === tid);
  const lesson = D.lessons.find((l) => l.t === tid);
  return {
    cards: cards.length, known: cards.filter((c) => ST.marks[c.id] === "k").length,
    calcs: calcs.length, calcOk: calcs.filter((c) => (ST.calc[c.id] || {}).ok).length,
    lesson, lessonState: lessonState(lesson.id)
  };
}
function lessonState(id) {
  const s = ST.lessons[id];
  if (!s) return "Not started";
  if (s.complete) return "Done";
  return "In progress";
}
function meterHTML(n, total) {
  const pct = total ? Math.round(n / total * 100) : 0;
  return `<span class="meter num"><i><b style="width:${pct}%"></b></i>${n}/${total}</span>`;
}
function dotsHTML(n) { return `<span class="dots" aria-label="${n} out of 5">${[0, 1, 2, 3, 4].map((i) => `<i class="${i < n ? "on" : ""}"></i>`).join("")}</span>`; }

/* ================================================================ dashboard */
function nextStep() {
  const todo = D.lessons.find((l) => !(ST.lessons[l.id] || {}).complete);
  if (todo) {
    const started = ST.lessons[todo.id];
    return { text: `${started ? "Carry on with" : "Start"} <b>Lesson ${todo.n}: ${todo.title}</b>. It takes about an hour.`, href: `#/lesson/${todo.id}`, label: started ? "Carry on" : "Start lesson" };
  }
  if (!ST.tests.length) return { text: "You have finished all six lessons. Now sit the <b>practice test</b>: 30 marks in 40 minutes.", href: "#/test", label: "Start practice test" };
  const red = D.topics.filter((t) => ST.rag[t.id] === "r" || ST.rag[t.id] === "a");
  if (red.length) return { text: `Go back over the topics you rated red or amber: <b>${red.map((t) => t.name).join(", ")}</b>.`, href: "#/flashcards", label: "Open flashcards" };
  return { text: "Keep your equations fresh with a quick drill, then go through any flashcards you are still learning.", href: "#/equations", label: "Equation drill" };
}

function weekPlan() {
  const left = daysLeft();
  if (left < 0) return "";
  if (left === 0) return `<p>The test is <b>today</b>. Do one quick equation drill, then read the common mistakes list. Good luck.</p>`;
  const todo = D.lessons.filter((l) => !(ST.lessons[l.id] || {}).complete);
  const days = [];
  const studyDays = Math.max(left - 1, 0);
  for (let i = 0; i < studyDays; i++) days.push([]);
  todo.forEach((l, i) => { if (studyDays) days[Math.min(Math.floor(i * studyDays / Math.max(todo.length, 1)), studyDays - 1)].push(`Lesson ${l.n}: ${l.title}`); });
  const rows = days.map((items, i) => {
    const d = new Date(today()); d.setDate(d.getDate() + i);
    const what = items.length ? items.join(" and ") : "Flashcards you are still learning, plus one equation drill";
    return `<tr><td class="num">${i === 0 ? "Today" : shortDate(d)}</td><td>${what}</td></tr>`;
  });
  const eve = new Date(testDate()); eve.setDate(eve.getDate() - 1);
  rows.push(`<tr><td class="num">${left === 1 ? "Today" : shortDate(eve)}</td><td>Practice test (40 minutes), then go over what you got wrong</td></tr>`);
  rows.push(`<tr><td class="num">${shortDate(testDate())}</td><td><b>Test day.</b> Quick equation drill at breakfast.</td></tr>`);
  return `<div class="tablewrap"><table><thead><tr><th style="width:130px">Day</th><th>What to do</th></tr></thead><tbody>${rows.join("")}</tbody></table></div>`;
}

function viewHome() {
  const ns = nextStep();
  const left = daysLeft();
  const rows = D.topics.map((t) => {
    const s = topicStats(t.id);
    const pill = s.lessonState === "Done" ? '<span class="pill done">Done</span>' : `<span class="pill">${s.lessonState}</span>`;
    return `<tr><td class="mono">${t.code}</td><td><a href="#/lesson/${s.lesson.id}">${t.name}</a></td><td>${pill}</td>
      <td>${meterHTML(s.known, s.cards)}</td><td>${s.calcs ? meterHTML(s.calcOk, s.calcs) : '<span class="small muted">None in this topic</span>'}</td><td class="c">${ragHTML(t.id)}</td></tr>`;
  }).join("");
  const tests = ST.tests.slice(-5).reverse();
  const best = ST.tests.reduce((b, x) => Math.max(b, x.score), 0);
  const testHTML = tests.length
    ? `<p>Best score: <b class="num">${best}/${D.test.marks}</b></p><table><thead><tr><th>Date</th><th>Score</th><th>Time</th></tr></thead><tbody>${tests.map((x) =>
        `<tr><td>${shortDate(new Date(x.date))}</td><td class="num">${x.score}/${x.total}</td><td class="num">${mmss(x.secs)}</td></tr>`).join("")}</tbody></table>`
    : `<p class="muted">You haven’t sat the practice test yet.</p>`;
  const eqRows = D.equations.map((q) => `<tr><td>${q.name}</td><td>${dotsHTML(ST.eq[q.id] || 0)}</td></tr>`).join("");
  return `<div class="content">
    <div class="head"><h1>Physics: energy stores and transfers</h1>
      <p>Half-termly test on <b>${longDate(testDate())}</b>${left > 0 ? ` (${plural(left, "day")} away)` : ""}. ${D.test.marks} marks, ${D.test.minutes} minutes, Higher tier.</p></div>
    <div class="panel spread"><p style="margin:0;max-width:52ch">${ns.text}</p><a class="btn primary" href="${ns.href}">${ns.label}</a></div>

    <div class="section"><h2>Revision tracker</h2>
      <div class="tablewrap"><table>
        <thead><tr><th>Spec</th><th>Topic</th><th>Lesson</th><th>Flashcards known</th><th>Calculations right</th><th class="c">Confidence</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
      <p class="small muted">Set your confidence for each topic: R (red) not confident, A (amber) getting there, G (green) confident. Be honest; it decides what the dashboard suggests.</p>

}

/* ================================================================ lesson player */
const LT = { id: null, sec: 0, remaining: 0, running: false, handle: null };
function stopLessonTimer() { if (LT.handle) clearInterval(LT.handle); LT.handle = null; LT.running = false; }

function blockHTML(b, lesson) {
  switch (b.type) {
    case "text": return b.html;
    case "book": return `<div class="book">${b.html}</div>`;
    case "tip": return `<div class="tipbox">${b.html}</div>`;
    case "objectives": return `<div class="aims"><h3>By the end of this lesson you should be able to:</h3><ul>${b.items.map((x) => `<li>${x}</li>`).join("")}</ul></div>`;
    case "reveal": return `<ul class="qlist">${b.items.map((it) => `<li><p class="q">${it.band ? `<span class="band ${it.band}">${it.band}</span>` : ""}${it.q}</p>
        <div class="ans" hidden><p>${it.a}</p></div><button class="btn small" data-act="reveal" style="margin-top:8px">Show answer</button></li>`).join("")}</ul>`;
    case "steps": return `<div class="worked"><h3>${b.title}</h3><ol>${b.steps.map((s, i) => `<li ${i ? "hidden" : ""}>${s}</li>`).join("")}</ol>
        <div class="ctrl row"><button class="btn small primary" data-act="step-next">Next step</button><button class="btn small" data-act="step-all">Show all steps</button></div></div>`;
    case "calc": return `<div class="stack">${b.items.map((it) => calcHTML(it.id, it.band)).join("")}</div>`;
    case "exam": return examHTML(b.id);
    case "bars": return `<div class="bars"><h3>${b.title}</h3>${b.stages.map((st) => `<div class="stage"><span>${st.label}</span><div class="rows">${b.stores.map((name, i) =>
        `<div><span class="small">${name}</span><i style="width:${st.values[i]}%"></i></div>`).join("")}</div></div>`).join("")}</div>`;
    case "split": return `<div class="split"><h3>${b.title}</h3><div class="strip">${b.parts.map((p) => `<div style="width:${p[1] / b.total * 100}%">${p[1]} ${b.unit}</div>`).join("")}</div>
        <ul>${b.parts.map((p) => `<li>${p[0]}: ${p[1]} ${b.unit}</li>`).join("")}</ul></div>`;
    case "memory": return memoryHTML(b.eqs);
    case "finish": return finishHTML(lesson);
    default: return "";
  }
}

function memoryHTML(ids) {
  const cards = ids.map((id) => {
    const q = EQ[id];
    return `<div class="eqitem" data-eqshow="${id}"><div class="top"><h3>${q.name}</h3><span class="small muted">${q.status}</span></div>
      <p class="tipline">${q.tip}</p>
      <p class="small muted" style="margin:6px 0 4px">Say or write it from memory first.</p>
      <div class="eqhide" hidden><div class="eqn"><span class="mk">${q.sym}</span></div></div>
      <button class="btn small" data-act="eq-show">Show it</button></div>`;
  }).join("");
  return `<div class="eqlist">${cards}</div>
    <div style="margin-top:12px"><h3 style="margin-bottom:6px">Quick check</h3><div data-quiz="${ids.join(",")}" data-n="4"></div></div>`;
}

function finishHTML(lesson) {
  const done = (ST.lessons[lesson.id] || {}).complete;
  return `<div class="panel" style="margin-top:16px">
    <h3>How confident do you feel about ${TOPIC[lesson.t].name.toLowerCase()} now?</h3>
    <p class="row" style="margin-top:8px">${ragHTML(lesson.t)} <span class="small muted">This updates your revision tracker.</span></p>
    <button class="btn primary" data-act="lesson-complete">${done ? "Lesson marked as done ✓" : "Mark this lesson as done"}</button>
  </div>`;
}

function renderTimer() {
  const el = document.getElementById("ltimer");
  if (!el) return;
  el.classList.toggle("over", LT.remaining < 0);
  el.querySelector("b").textContent = mmss(LT.remaining);
  el.querySelector("button").textContent = LT.running ? "Pause" : (LT.remaining < LT.full ? "Resume" : "Start timer");
}

function viewLesson(id) {
  const l = LESSON[id];
  if (!l) return `<div class="content"><h1>Lesson not found</h1><p><a href="#/lessons">Back to lessons</a></p></div>`;
  const s = ST.lessons[id] || { done: [], at: 0 };
  if (LT.id !== id) { stopLessonTimer(); LT.id = id; LT.sec = -1; }
  const at = Math.min(s.at || 0, l.sections.length - 1);
  const sec = l.sections[at];
  if (LT.sec !== at) { stopLessonTimer(); LT.sec = at; LT.full = sec.minutes * 60; LT.remaining = LT.full; }
  const plan = l.sections.map((x, i) => `<li><button type="button" data-goto="${i}" class="${(s.done || []).includes(i) ? "done" : ""}" ${i === at ? 'aria-current="step"' : ""}>
      <b>${x.kind} · ${x.minutes} min</b>${x.title}</button></li>`).join("");
  const body = sec.blocks.map((b) => blockHTML(b, l)).join("");
  const prev = at > 0 ? `<button class="btn" data-goto="${at - 1}">← ${l.sections[at - 1].kind}</button>` : `<a class="btn" href="#/lessons">← All lessons</a>`;
  const next = at < l.sections.length - 1 ? `<button class="btn primary" data-act="sec-next">Next: ${l.sections[at + 1].kind} →</button>`
    : (D.lessons[l.n] ? `<a class="btn primary" href="#/lesson/${D.lessons[l.n].id}">Next lesson →</a>` : `<a class="btn primary" href="#/test">Practice test →</a>`);
  return `<div class="content">
    <p class="crumb"><a href="#/lessons">Lessons</a> / Lesson ${l.n}</p>
    <div class="head"><h1>${l.title}</h1><p>Lesson ${l.n} of ${D.lessons.length} · ${TOPIC[l.t].code} · about ${l.minutes} minutes</p></div>
    <ol class="plan" aria-label="Lesson plan">${plan}</ol>
    <div class="secthead"><div><div class="kind">${sec.kind} · ${sec.minutes} minutes</div><h2>${sec.title}</h2></div>
      <div class="timer" id="ltimer"><b>${mmss(LT.remaining)}</b><button class="btn small" data-act="timer">Start timer</button><button class="btn small" data-act="timer-reset">Reset</button></div></div>
    ${body}
    <div class="pager">${prev}${next}</div>
  </div>`;
}

function lessonClick(e, id) {
  const l = LESSON[id];
  const s = ST.lessons[id] || (ST.lessons[id] = { done: [], at: 0 });
  const go = e.target.closest("[data-goto]");
  if (go) { s.at = +go.dataset.goto; save("lessons"); render(); window.scrollTo(0, 0); return; }
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const act = t.dataset.act;
  if (act === "sec-next") {
    if (!s.done.includes(s.at)) s.done.push(s.at);
    s.at = Math.min(s.at + 1, l.sections.length - 1); save("lessons"); render(); window.scrollTo(0, 0);
  } else if (act === "lesson-complete") {
    s.done = l.sections.map((_, i) => i); s.complete = true; save("lessons");
    t.textContent = "Lesson marked as done ✓";
    document.querySelectorAll(".plan button").forEach((b) => b.classList.add("done"));
  } else if (act === "timer") {
    if (LT.running) { stopLessonTimer(); }
    else {
      LT.running = true;
      LT.handle = setInterval(() => { LT.remaining -= 1; renderTimer(); }, 1000);
    }
    renderTimer();
  } else if (act === "timer-reset") {
    stopLessonTimer(); LT.remaining = LT.full; renderTimer();
  }
}

/* ================================================================ flashcards */
const KIND = { def: "Definition", eq: "Equation", calc: "Calculation", explain: "Explain", example: "Example", fact: "Key fact", mistake: "Spot the mistake", command: "Command word" };
const EXTRA_CARDS = [].concat(
  D.mistakes.map((m, i) => ({ id: "mis" + i, t: "mistakes", k: "mistake", q: "What’s wrong with this?<br><span style=\"font-weight:400\">" + m[0] + "</span>", a: "<p>" + m[1] + "</p>" })),
  D.commands.map((c, i) => ({ id: "cmd" + i, t: "commands", k: "command", q: "What does “" + c[0] + "” want you to do?", a: "<p>" + c[1] + "</p><p class=\"small muted\">Example: " + c[2] + "</p>" }))
);
EXTRA_CARDS.forEach((c) => { CARD[c.id] = c; });
const DECKS = [{ id: "all", name: "All six topics" }].concat(
  D.topics.map((t) => ({ id: t.id, name: t.code + " " + t.name })),
  [{ id: "mistakes", name: "Common mistakes" }, { id: "commands", name: "Command words" }]
);
const deckCards = (id) => (id === "all" ? D.cards : id === "mistakes" || id === "commands" ? EXTRA_CARDS.filter((c) => c.t === id) : D.cards.filter((c) => c.t === id)).map((c) => c.id);

const FC = { deck: null, queue: [], idx: 0, results: [], round: 1, flipped: false, shuffle: false };
function fcStart(deck) {
  FC.deck = deck; FC.round = 1; FC.results = []; FC.idx = 0; FC.flipped = false;
  FC.shuffle = !!ST.prefs.shuffle;
  const ids = deckCards(deck);
  FC.queue = FC.shuffle ? shuffle(ids) : ids;
  ST.prefs.deck = deck; save("prefs");
}
function cardLabel(c) {
  const where = TOPIC[c.t] ? TOPIC[c.t].code + " " + TOPIC[c.t].name : (c.t === "mistakes" ? "Common mistakes" : "Command words");
  return `<span>${where}</span><span>${KIND[c.k] || ""}${c.ht ? " · Higher" : ""}</span>`;
}
function cardBack(c) {
  if (c.k !== "eq") return c.a;
  const units = (c.u || []).map((u) => `<span><b>${u[0]}</b></span><span>${u[1]}</span><span class="u">${u[2]}</span>`).join("");
  return `<div class="eqn"><span class="mk">${c.eq}</span></div>${c.a || ""}${units ? `<div class="units">${units}</div>` : ""}`;
}
function fcActs() {
  return FC.flipped
    ? `<button class="btn learn" data-fc="l">Still learning <kbd>1</kbd></button><button class="btn know" data-fc="k">Know it <kbd>2</kbd></button>`
    : `<button class="btn primary full" data-fc="flip">Turn over <kbd>Space</kbd></button>`;
}
function fcFlip(force) {
  const card = document.getElementById("fcard");
  if (!card) return;
  FC.flipped = force === undefined ? !FC.flipped : force;
  card.classList.toggle("flipped", FC.flipped);
  card.querySelector(".front").setAttribute("aria-hidden", String(FC.flipped));
  card.querySelector(".back").setAttribute("aria-hidden", String(!FC.flipped));
  $view.querySelector(".fc .acts").innerHTML = fcActs();
}
function viewFlash() {
  if (!FC.deck || !DECKS.some((d) => d.id === FC.deck)) fcStart(ST.prefs.deck && DECKS.some((d) => d.id === ST.prefs.deck) ? ST.prefs.deck : "all");
  const picker = DECKS.map((d) => {
    const ids = deckCards(d.id), k = ids.filter((x) => ST.marks[x] === "k").length;
    return `<button type="button" data-deck="${d.id}" aria-pressed="${FC.deck === d.id}">${d.name} <span class="muted num">${k}/${ids.length}</span></button>`;
  }).join("");
  let main;
  if (FC.idx >= FC.queue.length) {
    const k = FC.results.filter((r) => r.v === "k"), l = FC.results.filter((r) => r.v === "l");
    main = `<div class="panel"><h2>${l.length ? (FC.round > 1 ? `Round ${FC.round} finished` : "Set finished") : "You know every card in this set"}</h2>
      <p>${plural(k.length, "card")} you know, ${plural(l.length, "card")} still to learn.</p>
      ${l.length ? `<ul>${l.map((r) => `<li>${strip(CARD[r.id].q)}</li>`).join("")}</ul>` : ""}
      <div class="row">${l.length ? `<button class="btn primary" data-fc="again-missed">Go through the ${l.length} I’m still learning</button>` : ""}
      <button class="btn" data-fc="restart">Start the set again</button></div></div>`;
  } else {
    const c = CARD[FC.queue[FC.idx]];
    const k = FC.results.filter((r) => r.v === "k").length;
    main = `<div class="status"><span class="num">${FC.round > 1 ? `Round ${FC.round} · ` : ""}Card ${FC.idx + 1} of ${FC.queue.length}</span><span class="num">${k} known · ${FC.results.length - k} still learning</span></div>
      <div class="track"><i style="width:${FC.idx / FC.queue.length * 100}%"></i></div>
      <div class="card ${FC.flipped ? "flipped" : ""}" id="fcard" tabindex="0" role="button" aria-label="Flashcard. Press Space to turn it over.">
        <div class="inner">
          <div class="face front" aria-hidden="${FC.flipped}"><div class="lab">${cardLabel(c)}</div><div class="prompt"><p>${c.q}</p></div><div class="lab"><span>Tap to turn over</span></div></div>
          <div class="face back" aria-hidden="${!FC.flipped}"><div class="lab">${cardLabel(c)}</div><div class="body">${cardBack(c)}</div></div>
        </div>
      </div>
      <div class="acts">${fcActs()}</div>
      <div class="row" style="justify-content:center;margin-top:10px">
        <button class="btn small" data-fc="back" ${FC.idx ? "" : "disabled"}>Previous card</button>
        <button class="btn small" data-fc="shuffle">Shuffle: ${FC.shuffle ? "on" : "off"}</button>
        <button class="btn small" data-fc="restart">Start again</button></div>`;
  }
  return `<div class="content"><div class="head"><h1>Flashcards</h1>
    <p>Say your answer out loud (or write it) before you turn the card over. Be strict with yourself: only press “Know it” if you got it fully right.</p></div>
    <div class="deckpick">${picker}</div><div class="fc">${main}</div></div>`;
}
function fcRate(v) {
  if (!FC.flipped || FC.idx >= FC.queue.length) return;
  const id = FC.queue[FC.idx];
  FC.results.push({ id, v }); ST.marks[id] = v; save("marks");
  FC.idx += 1; FC.flipped = false; render();
}
function fcClick(e) {
  const d = e.target.closest("[data-deck]");
  if (d) { fcStart(d.dataset.deck); render(); return; }
  if (e.target.closest("#fcard")) { fcFlip(); return; }
  const b = e.target.closest("[data-fc]");
  if (!b) return;
  const a = b.dataset.fc;
  if (a === "flip") { fcFlip(true); return; }
  if (a === "k" || a === "l") { fcRate(a); return; }
  else if (a === "back" && FC.idx > 0) { FC.idx -= 1; FC.results.pop(); FC.flipped = false; }
  else if (a === "shuffle") { ST.prefs.shuffle = !ST.prefs.shuffle; save("prefs"); fcStart(FC.deck); }
  else if (a === "restart") { fcStart(FC.deck); }
  else if (a === "again-missed") {
    const missed = FC.results.filter((r) => r.v === "l").map((r) => r.id);
    FC.round += 1; FC.results = []; FC.idx = 0; FC.flipped = false;
    FC.queue = FC.shuffle ? shuffle(missed) : missed;
  }
  render();
}
function fcKey(e) {
  if (e.target.matches("input,textarea,select")) return;
  if (e.key === " " || (e.key === "Enter" && e.target.id === "fcard")) {
    if (e.target.matches("button")) return;
    e.preventDefault(); fcFlip();
  } else if (e.key === "1" || e.key === "ArrowLeft") { fcRate("l"); }
  else if (e.key === "2" || e.key === "ArrowRight") { fcRate("k"); }
}
let touchX = null;
function fcTouchStart(e) { if (e.target.closest("#fcard")) touchX = [e.changedTouches[0].clientX, e.changedTouches[0].clientY]; }
function fcTouchEnd(e) {
  if (!touchX) return;
  const dx = e.changedTouches[0].clientX - touchX[0], dy = e.changedTouches[0].clientY - touchX[1];
  touchX = null;
  if (FC.flipped && Math.abs(dx) > 70 && Math.abs(dy) < 50) { e.preventDefault(); fcRate(dx > 0 ? "k" : "l"); }
}
