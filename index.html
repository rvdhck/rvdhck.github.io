/* ================================================================ practice test */
const TT = { handle: null };
const TEST_SECS = D.test.minutes * 60;
function stopTestTimer() { if (TT.handle) clearInterval(TT.handle); TT.handle = null; }
function allParts() { return D.test.questions.flatMap((q) => q.parts); }
function startTestTimer() {
  stopTestTimer();
  TT.handle = setInterval(() => {
    const d = ST.draft;
    if (!d || d.status !== "running") { stopTestTimer(); return; }
    d.secs += 1;
    if (d.secs % 5 === 0) save("draft");
    const el = document.getElementById("ttime");
    if (el) {
      const left = TEST_SECS - d.secs;
      el.textContent = left >= 0 ? mmss(left) + " left" : "Time’s up (" + mmss(-left) + " over)";
      el.parentElement.classList.toggle("over", left < 0);
    }
  }, 1000);
}
function partScore(p, d) {
  const ans = d.answers[p.n] || "";
  if (p.kind === "calc" && checkNum(ans, [p.ans].concat(p.alt || [])).state === "ok") return { score: p.marks, auto: true };
  const ticks = (d.ticks[p.n] || []).length;
  return { score: Math.min(p.marks, ticks), auto: false };
}
function testTotal(d) { return allParts().reduce((a, p) => a + partScore(p, d).score, 0); }

function viewTest() {
  const d = ST.draft;
  if (!d) {
    const hist = ST.tests.slice().reverse().map((x) => `<tr><td>${shortDate(new Date(x.date))}</td><td class="num">${x.score}/${x.total}</td><td class="num">${Math.round(x.score / x.total * 100)}%</td><td class="num">${mmss(x.secs)}</td></tr>`).join("");
    return `<div class="content"><div class="head"><h1>Practice test</h1><p>Energy stores and transfers · Higher tier</p></div>
      <div class="panel">
        <p><b>Time allowed: ${D.test.minutes} minutes.</b> Total: ${D.test.marks} marks.</p>
        <ul><li>Answer all questions.</li><li>You need a calculator, a pen and some paper for working.</li>
          <li>For calculations, type your final answer in the box. For other questions, write your answer in the box.</li>
          <li>When you finish, you mark your own test using the mark scheme. Calculations with the right final answer are marked for you.</li></ul>
        <button class="btn primary" data-t="start">Start the test</button>
      </div>
      ${hist ? `<div class="section"><h2>Your results</h2><div class="tablewrap"><table><thead><tr><th>Date</th><th>Score</th><th>Percentage</th><th>Time taken</th></tr></thead><tbody>${hist}</tbody></table></div></div>` : ""}
    </div>`;
  }
  const marking = d.status === "marking";
  const left = TEST_SECS - d.secs;
  const bar = marking
    ? `<div class="testbar spread"><span class="result num">Score: <span id="tscore">${testTotal(d)}</span>/${D.test.marks}</span>
        <div class="row"><button class="btn primary" data-t="save">Save my result</button><button class="btn" data-t="discard">Delete this attempt</button></div></div>`
    : `<div class="testbar spread"><span class="timer ${left < 0 ? "over" : ""}"><b id="ttime" style="min-width:auto">${left >= 0 ? mmss(left) + " left" : "Time’s up"}</b></span>
        <div class="row"><button class="btn" data-t="pause">${d.status === "running" ? "Pause" : "Resume"}</button><button class="btn primary" data-t="mark">Finish and mark</button></div></div>`;
  const qs = D.test.questions.map((q) => `<div class="qblock"><h3>Question ${q.n}</h3><p class="muted">${q.intro}</p>${q.parts.map((p) => {
    const ans = d.answers[p.n] || "";
    const input = p.kind === "calc"
      ? `<div class="row"><label class="sr" for="tp-${p.n}">Answer to ${p.n}</label><input id="tp-${p.n}" data-part="${p.n}" inputmode="decimal" value="${esc(ans)}" ${marking ? "disabled" : ""}><span class="mono muted">${p.unit}</span></div>`
      : `<label class="sr" for="tp-${p.n}">Answer to ${p.n}</label><textarea id="tp-${p.n}" data-part="${p.n}" ${marking ? "disabled" : ""}>${esc(ans)}</textarea>`;
    let mark = "";
    if (marking) {
      const ps = partScore(p, d), ticks = d.ticks[p.n] || [];
      mark = `<div class="scheme"><h4>Mark scheme</h4>${ps.auto ? `<p class="tick">✓ Correct final answer: ${p.marks} marks</p>` : ""}
        ${p.scheme.map((line, i) => `<label><input type="checkbox" data-tick="${p.n}" data-i="${i}" ${ticks.includes(i) || ps.auto ? "checked" : ""} ${ps.auto ? "disabled" : ""}><span>${line}</span></label>`).join("")}
        <p class="total">Marks: <span data-ps="${p.n}">${ps.score}</span>/${p.marks}</p></div>`;
    }
    return `<div class="part"><div class="qtext"><p><b class="pn">${p.n}</b>${p.q}</p><span class="marks">[${p.marks} mark${p.marks > 1 ? "s" : ""}]</span></div>${input}${mark}</div>`;
  }).join("")}</div>`).join("");
  return `<div class="content test"><div class="head"><h1>Practice test</h1><p>${marking ? "Mark each answer. Tick a point only if your answer really says it." : "Work on paper, then type your answers."}</p></div>${bar}${qs}</div>`;
}
function testClick(e) {
  const b = e.target.closest("[data-t]");
  if (!b) return;
  const a = b.dataset.t;
  if (a === "start") { ST.draft = { status: "running", secs: 0, answers: {}, ticks: {}, started: Date.now() }; save("draft"); render(); startTestTimer(); }
  else if (a === "pause") { ST.draft.status = ST.draft.status === "running" ? "paused" : "running"; save("draft"); render(); if (ST.draft.status === "running") startTestTimer(); else stopTestTimer(); }
  else if (a === "mark") {
    const blank = allParts().filter((p) => !(ST.draft.answers[p.n] || "").trim()).length;
    let ok = true;
    try { ok = !blank || window.confirm(`You have ${plural(blank, "blank answer")}. Finish and mark anyway?`); } catch (err) { ok = true; }
    if (!ok) return;
    stopTestTimer(); ST.draft.status = "marking"; save("draft"); render(); window.scrollTo(0, 0);
  } else if (a === "save") {
    ST.tests.push({ date: Date.now(), score: testTotal(ST.draft), total: D.test.marks, secs: ST.draft.secs });
    save("tests"); ST.draft = null; save("draft"); render(); window.scrollTo(0, 0);
  } else if (a === "discard") {
    let ok = true;
    try { ok = window.confirm("Delete this attempt without saving the score?"); } catch (err) { ok = true; }
    if (!ok) return;
    ST.draft = null; save("draft"); render();
  }
}
function testInput(e) {
  const d = ST.draft;
  if (!d) return;
  const inp = e.target.closest("[data-part]");
  if (inp) { d.answers[inp.dataset.part] = inp.value; save("draft"); return; }
  const cb = e.target.closest("[data-tick]");
  if (cb) {
    const n = cb.dataset.tick, i = +cb.dataset.i;
    const set = new Set(d.ticks[n] || []);
    if (cb.checked) set.add(i); else set.delete(i);
    d.ticks[n] = [...set]; save("draft");
    const p = allParts().find((x) => x.n === n);
    document.querySelector(`[data-ps="${n}"]`).textContent = partScore(p, d).score;
    document.getElementById("tscore").textContent = testTotal(d);
  }
}

/* ================================================================ equation quiz engine */
function makeQuestion(eq, avoid) {
  const types = ["pick", "gap", "rearr"];
  if (eq.units.some((u) => u[0] && !u[2].startsWith("no unit"))) types.push("unit");
  const pool = types.filter((t) => t !== avoid);
  const type = pool[Math.floor(Math.random() * pool.length)];
  if (type === "pick") return { eq: eq.id, type, prompt: `Which is the equation for <b>${eq.name.toLowerCase()}</b>?`, answer: eq.plain, options: shuffle([eq.plain].concat(eq.wrong.slice(0, 3))) };
  if (type === "gap") return { eq: eq.id, type, prompt: `Fill the gap: <span class="mk">${eq.gap.show}</span>`, answer: eq.gap.answer, options: shuffle(eq.gap.options) };
  if (type === "rearr") {
    const r = eq.rearr[Math.floor(Math.random() * eq.rearr.length)];
    return { eq: eq.id, type, prompt: `Rearrange <b>${eq.plain}</b> to find <b>${r.find}</b>.`, answer: r.right, options: shuffle([r.right].concat(r.wrong.slice(0, 3))) };
  }
  const rows = eq.units.filter((u) => u[0] && !u[2].startsWith("no unit"));
  const u = rows[Math.floor(Math.random() * rows.length)];
  const others = shuffle(D.unitPool.filter((x) => x !== u[2])).slice(0, 3);
  return { eq: eq.id, type, prompt: `In the ${eq.name.toLowerCase()} equation, what is the unit of <b>${u[1]}</b>?`, answer: u[2], options: shuffle([u[2]].concat(others)) };
}
function pickWeighted(ids) {
  const weights = ids.map((id) => 6 - (ST.eq[id] || 0));
  let r = Math.random() * weights.reduce((a, b) => a + b, 0);
  for (let i = 0; i < ids.length; i++) { r -= weights[i]; if (r <= 0) return ids[i]; }
  return ids[ids.length - 1];
}
function startQuiz(box, ids, n) {
  const Q = { ids, n, i: 0, right: 0, list: [], answered: null };
  let last = null;
  for (let k = 0; k < n; k++) { let id = pickWeighted(ids); if (ids.length > 1 && id === last) id = pickWeighted(ids); last = id; Q.list.push(makeQuestion(EQ[id])); }
  box._quiz = Q;
  drawQuiz(box);
}
function drawQuiz(box) {
  const Q = box._quiz;
  if (Q.i >= Q.list.length) {
    box.innerHTML = `<div class="quiz"><p class="qtitle">${Q.right} out of ${Q.list.length} right</p>
      <p class="muted">${Q.right === Q.list.length ? "All correct. Come back tomorrow and do it again so it sticks." : "The equations you got wrong will come up more often next time."}</p>
      <button class="btn primary" data-q="again">Go again</button></div>`;
    return;
  }
  const q = Q.list[Q.i];
  const opts = q.options.map((o, k) => {
    let cls = "";
    if (Q.answered !== null) { if (o === q.answer) cls = "right"; else if (k === Q.answered) cls = "wrong"; }
    return `<button type="button" data-opt="${k}" class="${cls}" ${Q.answered !== null ? "disabled" : ""}>${o}</button>`;
  }).join("");
  const feedback = Q.answered === null ? "" : (q.options[Q.answered] === q.answer
    ? `<p class="fb ok">✓ Correct.</p>`
    : `<p class="fb no">✗ The answer is ${q.answer}.</p><p class="hint">${EQ[q.eq].tip}</p><p class="small muted">This equation will come back in a moment.</p>`);
  box.innerHTML = `<div class="quiz"><div class="spread small muted"><span>Question ${Q.i + 1} of ${Q.list.length}</span><span>${Q.right} right</span></div>
    <p class="qtitle">${q.prompt}</p><div class="opts">${opts}</div>${feedback}
    ${Q.answered !== null ? `<div class="row" style="margin-top:12px"><button class="btn primary" data-q="next">Next question</button></div>` : ""}</div>`;
}
function quizClick(e) {
  const box = e.target.closest("[data-quiz]");
  if (!box || !box._quiz) return false;
  const Q = box._quiz;
  const opt = e.target.closest("[data-opt]");
  if (opt && Q.answered === null) {
    Q.answered = +opt.dataset.opt;
    const q = Q.list[Q.i];
    const ok = q.options[Q.answered] === q.answer;
    ST.eq[q.eq] = Math.max(0, Math.min(5, (ST.eq[q.eq] || 0) + (ok ? 1 : -1))); save("eq");
    if (ok) Q.right += 1;
    else Q.list.splice(Math.min(Q.i + 3, Q.list.length), 0, makeQuestion(EQ[q.eq], q.type));
    drawQuiz(box); return true;
  }
  const b = e.target.closest("[data-q]");
  if (b && b.dataset.q === "next") { Q.i += 1; Q.answered = null; drawQuiz(box); return true; }
  if (b && b.dataset.q === "again") { startQuiz(box, Q.ids, Q.n); return true; }
  return false;
}
function mountQuizzes() {
  $view.querySelectorAll("[data-quiz]").forEach((box) => startQuiz(box, box.dataset.quiz.split(","), +box.dataset.n || 10));
}

/* ================================================================ equations page */
function viewEq() {
  const methods = D.memory.map((m) => `<li><b>${m[0]}.</b> ${m[1]}</li>`).join("");
  const blank = D.equations.map((q) => `<li class="qlist-item" data-eqshow="${q.id}"><div class="spread"><span><b>${q.name}</b></span>
      <span class="row"><button class="btn small" data-act="eq-show">Show it</button>
      <button class="btn small know" data-blank="${q.id}" data-v="1">Got it</button><button class="btn small learn" data-blank="${q.id}" data-v="-1">Missed it</button></span></div>
      <div class="eqhide" hidden><div class="eqn"><span class="mk">${q.sym}</span></div></div></li>`).join("");
  const list = D.equations.map((q) => `<div class="eqitem"><div class="top"><h3>${q.name}</h3><span class="row small muted">${q.status} ${dotsHTML(ST.eq[q.id] || 0)}</span></div>
      <div class="eqn"><span class="mk">${q.sym}</span></div>${q.words ? `<p class="small">${q.words}</p>` : ""}
      <div class="tablewrap"><table><tbody>${q.units.map((u) => `<tr><td style="width:60px">${u[0]}</td><td>${u[1]}</td><td class="mono">${u[2]}</td></tr>`).join("")}</tbody></table></div>
      <p class="tipline"><b>Remember:</b> ${q.tip}</p></div>`).join("");
  return `<div class="content"><div class="head"><h1>Equations</h1>
    <p>Nine equations for this test. The GCSE exam gives you a sheet, but school tests often don’t, and you still need to choose the right one, rearrange it and use the right units.</p></div>
    <div class="section"><h2>Drill</h2><p class="muted">Ten quick questions. Equations you get wrong come back more often.</p>
      <div data-quiz="${D.equations.map((q) => q.id).join(",")}" data-n="10"></div></div>
    <div class="section"><h2>Blank page check</h2>
      <p class="muted">Write each equation on paper from memory, then show it and be honest.</p>
      <ul class="qlist blank">${blank}</ul></div>
    <div class="section"><h2>How to remember them</h2><ol>${methods}</ol></div>
    <div class="section"><h2>All nine equations</h2><div class="eqlist">${list}</div></div></div>`;
}
function eqClick(e) {
  const b = e.target.closest("[data-blank]");
  if (!b) return;
  const id = b.dataset.blank;
  ST.eq[id] = Math.max(0, Math.min(5, (ST.eq[id] || 0) + (+b.dataset.v))); save("eq");
  b.closest("li").querySelector(".eqhide").hidden = false;
  b.parentElement.innerHTML = `<span class="small ${+b.dataset.v > 0 ? "tick" : "cross"}">${+b.dataset.v > 0 ? "✓ Noted" : "Noted. It will come up more in the drill."}</span>`;
}

/* ================================================================ mistakes and command words */
function viewSkills() {
  const mis = D.mistakes.map((m) => `<tr class="mistake"><td>${m[0]}</td><td>${m[1]}</td></tr>`).join("");
  const cmd = D.commands.map((c) => `<tr><td><b>${c[0]}</b></td><td>${c[1]}</td><td class="muted">${c[2]}</td></tr>`).join("");
  return `<div class="content"><div class="head"><h1>Mistakes and command words</h1>
    <p>Most lost marks come from the same few slips, or from answering a different question to the one asked.</p></div>
    <div class="section"><div class="spread"><h2>Common mistakes</h2><a class="btn small" href="#/flashcards" data-open-deck="mistakes">Practise as flashcards</a></div>
      <div class="tablewrap"><table><thead><tr><th>Don’t do this</th><th>Do this instead</th></tr></thead><tbody>${mis}</tbody></table></div></div>
    <div class="section"><div class="spread"><h2>Command words</h2><a class="btn small" href="#/flashcards" data-open-deck="commands">Practise as flashcards</a></div>
      <p class="muted">The first word of a question tells you what kind of answer gets the marks.</p>
      <div class="tablewrap"><table><thead><tr><th>Word</th><th>What it wants</th><th>Example</th></tr></thead><tbody>${cmd}</tbody></table></div></div></div>`;
}

/* ================================================================ router */
const ROUTES = [
  { path: "", label: "Dashboard", view: viewHome },
  { path: "lessons", label: "Lessons", view: viewLessons },
  { sep: true },
  { path: "flashcards", label: "Flashcards", view: viewFlash, click: fcClick, key: fcKey },
  { path: "calculations", label: "Calculations", view: viewCalc, change: calcChange },
  { path: "exam", label: "Exam questions", view: viewExam, change: examChange },
  { path: "test", label: "Practice test", view: viewTest, click: testClick, input: testInput },
  { sep: true },
  { path: "equations", label: "Equations", view: viewEq, click: eqClick },
  { path: "skills", label: "Mistakes and command words", view: viewSkills },
];
let current = null;
function parseHash() {
  const h = location.hash.replace(/^#\/?/, "");
  const [a, b] = h.split("/");
  if (a === "lesson" && b) return { path: "lessons", lesson: b };
  return { path: ROUTES.some((r) => r.path === a) ? a : "", lesson: null };
}
function render() {
  const r = parseHash();
  const route = ROUTES.find((x) => x.path === r.path);
  $view.innerHTML = r.lesson ? viewLesson(r.lesson) : route.view();
  if (r.lesson) renderTimer();
  mountQuizzes();
  document.querySelectorAll(".side a").forEach((a) => { if (a.dataset.path === r.path) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  document.title = (r.lesson && LESSON[r.lesson] ? "Lesson " + LESSON[r.lesson].n : route.label) + " · Energy revision";
  current = { route, lesson: r.lesson };
}
function navigate() {
  const was = current;
  stopLessonTimer();
  if (!(parseHash().path === "test")) stopTestTimer();
  render();
  if (was) { window.scrollTo(0, 0); $view.focus({ preventScroll: true }); }
  if (current.route.path === "test" && ST.draft && ST.draft.status === "running" && !TT.handle) startTestTimer();
}

$view.onclick = (e) => {
  const open = e.target.closest("[data-open-deck]");
  if (open) { fcStart(open.dataset.openDeck); return; }
  if (quizClick(e)) return;
  if (current.lesson) { if (!commonClick(e)) lessonClick(e, current.lesson); return; }
  if (commonClick(e)) return;
  if (current.route.click) current.route.click(e);
};
$view.oninput = (e) => { commonInput(e); if (current.route.input) current.route.input(e); };
$view.onchange = (e) => { commonInput(e); if (current.route.change) current.route.change(e); if (current.route.input && e.target.type === "checkbox") current.route.input(e); };
$view.onkeydown = commonKey;
document.addEventListener("keydown", (e) => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (current && !current.lesson && current.route.key) current.route.key(e);
});
$view.addEventListener("touchstart", (e) => { if (current && current.route.path === "flashcards") fcTouchStart(e); }, { passive: true });
$view.addEventListener("touchend", (e) => { if (current && current.route.path === "flashcards") fcTouchEnd(e); });

/* ================================================================ boot */
document.getElementById("nav").innerHTML = ROUTES.map((r) => r.sep ? '<span class="sep" aria-hidden="true"></span>'
  : `<a href="#/${r.path}" data-path="${r.path}">${r.label}</a>`).join("");
(function countdown() {
  const n = daysLeft();
  const el = document.getElementById("count");
  el.innerHTML = n > 0 ? `Test: <b>${shortDate(testDate())}</b><br>${plural(n, "day")} to go` : n === 0 ? "<b>Test today</b><br>Good luck" : `Test was on ${shortDate(testDate())}`;
})();
document.getElementById("reset").onclick = () => {
  let ok = true;
  try { ok = window.confirm("Reset all your progress on this device? This clears flashcards, lessons, scores and equation practice."); } catch (e) { ok = true; }
  if (!ok) return;
  ["marks", "calc", "exam", "eq", "lessons", "rag", "prefs"].forEach((k) => { ST[k] = {}; save(k); });
  ST.tests = []; save("tests"); ST.draft = null; save("draft");
  FC.deck = null; render();
};
window.addEventListener("hashchange", navigate);
navigate();

})();
</script>
